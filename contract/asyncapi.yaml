asyncapi: "2.6.0"

info:
  title: UNI WebSocket API
  version: "1.0.0"
  description: >
    Bidirectional WebSocket protocol between the UNI Svelte frontend and
    the uWebSockets C++ backend. Every frame is a JSON object with at minimum
    an `action` field. Client-originated frames may carry an optional
    `request_id` that the server echoes back for request/response correlation.

servers:
  production:
    url: "wss://{host}"
    protocol: wss
    variables:
      host:
        default: localhost

# ---------------------------------------------------------------------------
# Channels
# ---------------------------------------------------------------------------
channels:
  /:
    description: The root WebSocket endpoint — all messages flow through here.
    subscribe:
      summary: Messages sent from the Server to the Client.
      message:
        oneOf:
          - $ref: "#/components/messages/Success"
          - $ref: "#/components/messages/Error"
          - $ref: "#/components/messages/LobbyList"
          - $ref: "#/components/messages/LobbyJoined"
          - $ref: "#/components/messages/LobbyUpdated"
          - $ref: "#/components/messages/LobbyLeft"
          - $ref: "#/components/messages/LobbyEvicted"
          - $ref: "#/components/messages/MatchStateUpdated"
          - $ref: "#/components/messages/MatchOver"
          - $ref: "#/components/messages/MatchEvent"
          - $ref: "#/components/messages/ChatMessage"
          - $ref: "#/components/messages/ChatHistory"
          - $ref: "#/components/messages/FriendList"
          - $ref: "#/components/messages/Metadata"

    publish:
      summary: Messages sent from the Client to the Server.
      message:
        oneOf:
          - $ref: "#/components/messages/MatchPlayCard"
          - $ref: "#/components/messages/DirectorCommand"

          - $ref: "#/components/messages/MatchDrawCard"
          - $ref: "#/components/messages/MatchKeepDrawn"
          - $ref: "#/components/messages/MatchSubmitInput"
          - $ref: "#/components/messages/MatchPromptResponse"
          - $ref: "#/components/messages/MatchWindowResponse"
          - $ref: "#/components/messages/MatchExit"
          - $ref: "#/components/messages/MatchClientReady"
          - $ref: "#/components/messages/MatchSnapshotRequest"
          - $ref: "#/components/messages/LobbyListRequest"
          - $ref: "#/components/messages/LobbyCreate"
          - $ref: "#/components/messages/LobbyJoin"
          - $ref: "#/components/messages/LobbyRejoin"
          - $ref: "#/components/messages/LobbyQuickJoin"
          - $ref: "#/components/messages/LobbyLeave"
          - $ref: "#/components/messages/LobbyToggleReady"
          - $ref: "#/components/messages/LobbyPromote"
          - $ref: "#/components/messages/LobbyKick"
          - $ref: "#/components/messages/LobbyUpdateSettings"
          - $ref: "#/components/messages/LobbyStartMatch"
          - $ref: "#/components/messages/ChatSend"
          - $ref: "#/components/messages/ChatHistoryRequest"
          - $ref: "#/components/messages/FriendRequest"
          - $ref: "#/components/messages/FriendResponse"
          - $ref: "#/components/messages/FriendListRequest"
          - $ref: "#/components/messages/MetadataRequest"
          - $ref: "#/components/messages/UserUpdatePrivacy"
          - $ref: "#/components/messages/SpectatorView"

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------
components:
  # -------------------------------------------------------------------------
  # Event-stream packet type registry
  # -------------------------------------------------------------------------
  # The MatchEvent envelope's `type` field carries one of these EXACT wire
  # strings; clients dispatch on the string and the server MUST emit the
  # matching value. Key = wire `type`, value = the payload schema describing
  # the envelope `payload` object. Add new packet types here additively.
  # This map is documentation/registry only; the codegens ignore unknown
  # `x-` extensions, so adding it changes no generated artifact.
  # `chain_aborted` and `mod_disarmed` are server-only diagnostics (audience
  # `none`): they never leave the server, so they have no packet type.
  x-packet-types:
    match_start: MatchStartPayload
    players_ready: PlayersReadyPayload
    match_begin: MatchBeginPayload
    defs: DefsPayload
    card_played: CardPlayedPayload
    play_rejected: PlayRejectedPayload
    cards_drawn: CardsDrawnPayload
    drawn_card_kept: DrawnCardKeptPayload
    reshuffle: ReshufflePayload
    hands_swapped: HandsSwappedPayload
    hands_passed: HandsPassedPayload
    hands_redistributed: HandsRedistributedPayload
    card_moved: CardMovedPayload
    card_created: CardCreatedPayload
    card_removed: CardRemovedPayload
    card_replaced: CardReplacedPayload
    status_applied: StatusAppliedPayload
    status_removed: StatusRemovedPayload
    window_opened: WindowOpenedPayload
    window_responded: WindowRespondedPayload
    window_closed: WindowClosedPayload
    auto_played: AutoPlayedPayload
    prompt_opened: PromptOpenedPayload
    prompt_answered: PromptAnsweredPayload
    turn_advance: TurnAdvancePayload
    direction_changed: DirectionChangedPayload
    mod_event: ModEventPayload
    turn_skipped: TurnSkippedPayload
    extra_turn_granted: ExtraTurnGrantedPayload
    near_win_entered: NearWinEnteredPayload
    blocked: BlockedPayload
    active_type_changed: ActiveTypeChangedPayload
    restriction_added: RestrictionAddedPayload
    restriction_removed: RestrictionRemovedPayload
    turn_timer_changed: TurnTimerChangedPayload
    round_advance: RoundAdvancePayload
    signal: SignalPayload
    visibility_granted: VisibilityGrantedPayload
    visibility_revoked: VisibilityRevokedPayload
    outcome_rolled: OutcomeRolledPayload
    status_modified: StatusModifiedPayload
    placement_set: PlacementSetPayload
    match_ended: MatchEndedPayload

  # -------------------------------------------------------------------------
  # Messages
  # -------------------------------------------------------------------------
  messages:
    # --- Server → Client (payloads described inline — not code-generated) ---

    Success:
      name: success
      title: Generic Success
      payload:
        type: object
        properties:
          action:
            type: string
            enum: ["success"]
          request_id:
            type: string

    Error:
      name: error
      title: Generic Error
      payload:
        type: object
        required: [action, code]
        properties:
          action:
            type: string
            enum: ["error"]
          request_id:
            type: string
          code:
            type: string
            description: >
              A stable ErrorCode wire string (see x-enums/ErrorCode). The client
              maps it to a human-readable message; the backend never sends prose.
          detail:
            type: string
            description: >
              Optional supplementary context for the few dynamic errors (e.g. a
              payload parse message). Never the primary user-facing string.

    LobbyList:
      name: lobby_list
      title: Public Lobby List (server push)
      payload:
        type: object
        required: [action, lobbies]
        properties:
          action:
            type: string
            enum: ["lobby_list"]
          request_id:
            type: string
          lobbies:
            type: array
            items:
              type: object
              required:
                [
                  name,
                  member_count,
                  bot_count,
                  max_players,
                  invite_code,
                  status,
                  active_mods,
                  allow_bot_takeover
                ]
              properties:
                name:
                  $ref: "#/components/schemas/LobbyName"
                member_count:
                  type: integer
                bot_count:
                  type: integer
                max_players:
                  $ref: "#/components/schemas/LobbyMemberCap"
                invite_code:
                  $ref: "#/components/schemas/LobbyCode"
                status:
                  type: string
                  enum: ["open", "in-game", "full"]
                active_mods:
                  type: array
                  items:
                    type: string
                allow_bot_takeover:
                  type: boolean

    LobbyJoined:
      name: lobby_joined
      title: Lobby Joined
      payload:
        type: object
        required: [action, lobby]
        properties:
          action:
            type: string
            enum: ["lobby_joined"]
          request_id:
            type: string
          lobby:
            type: object
            description: Full lobby state.

    Metadata:
      name: metadata
      title: Server Metadata (rule catalog)
      payload:
        type: object
        required: [action, available_rules]
        properties:
          action:
            type: string
            enum: ["metadata"]
          request_id:
            type: string
          available_rules:
            type: array
            description: List of rules supported by this server instance.
            items:
              type: object
              required: [id, label, description]
              properties:
                id:
                  type: string
                  description: Rule identifier used in active_mods.
                label:
                  type: string
                  description: Short human-readable name for UI display.
                description:
                  type: string
                  description: One-sentence explanation of the rule's effect.
          mods:
            type: array
            description: >
              The text listing of the loaded mods, for use before a match
              starts: the same `texts` and `glossary` listings that the `defs`
              packet carries. The lobby shows glossary tooltips before any
              `defs` packet exists. A mod with neither listing is absent.
            items:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                texts:
                  type: array
                  items:
                    $ref: "#/components/schemas/ModTextsFile"
                glossary:
                  type: array
                  items:
                    $ref: "#/components/schemas/ModGlossaryEntry"

    LobbyUpdated:
      name: lobby_updated
      title: Lobby State Broadcast
      payload:
        type: object
        required: [action, lobby]
        properties:
          action:
            type: string
            enum: ["lobby_updated"]
          lobby:
            type: object
            description: Full lobby state.

    LobbyLeft:
      name: lobby_left
      title: Successfully Left Lobby
      payload:
        type: object
        properties:
          action:
            type: string
            enum: ["lobby_left"]
          request_id:
            type: string

    LobbyEvicted:
      name: lobby_evicted
      title: Evicted — Lobby Closed
      payload:
        type: object
        properties:
          action:
            type: string
            enum: ["lobby_evicted"]
          reason:
            type: string

    MatchStateUpdated:
      name: match_state_updated
      title: Match State Broadcast
      payload:
        type: object
        required: [action, match_state]
        properties:
          action:
            type: string
            enum: ["match_state_updated"]
          match_state:
            type: object
            description: >
              Opaque per-player serialized match state produced by
              MatchInstance::SerializePlayerState(). Structure owned by the match engine.
              Timer fields: `server_now_ms` is the server clock the absolute
              deadlines are measured on (`turn_deadline_ms`, `window.deadline_ms`,
              `prompts[].deadline_ms`); `window` has the `WindowOpenedPayload`
              shape plus `responses`, and `prompts[]` the `PromptOpenedPayload` shape
              (with `duration_ms`). `prompt_wait` ({deadline_ms,
              duration_ms}, same absolute convention as `prompts[]`) is sent to
              EVERY viewer while any prompt is pending and carries only the
              clock, never the payload or target; it is omitted when no
              prompt is pending. Observers draw the wait from it.
              `pending_play_drawn` is null unless a playable voluntary draw
              parks a play/keep choice; it is `{player, card}` for the owner and
              `{player}` (no card key) for every other viewer, so the drawn
              identity never leaks.
              Outcome fields: `mode` is `"standard"` or `"race"`; `race_target`
              is the number of finishers that end a race (0 in standard mode,
              fixed from the seated count at match start); `placements` lists
              usernames best-first. In a race it grows as seats finish and
              `winner` stays empty until the race ends, when every seat still
              holding cards is ranked below the finishers.
              `context` holds the engine-owned values that a late joiner or
              a seat after `match_snapshot_request` reads instead of
              rebuilding them from client events (see `SnapshotContext`).
              `tail` (warm-up snapshot only: a late join, a reconnect and the
              answer to `match_snapshot_request`; a broadcast snapshot has no
              `tail`) holds the retained client events for the PLAY LOG. It
              is a self-contained list: its `sequence` numbers start at 0 and
              count the tail only, it never consumes the live stream of the
              recipient, and every envelope has `replayed: true`. The live
              stream continues at `seq_watermark` with no gap and no
              duplicate. The server stores each logical client event one time
              and projects it for the recipient with the same redaction as a
              live event. A client feeds the tail to the play log ONLY: no
              animation, no sound, no timer and no state change. Retention:
              see `MatchEventPayload.replayed`.
            properties:
              context:
                $ref: "#/components/schemas/SnapshotContext"
              tail:
                type: array
                items:
                  $ref: "#/components/schemas/MatchEventPayload"
          action_required:
            type: integer
            description: >
              Integer index of the Action enum value the server is waiting for.
              Present only when the server awaits a match_submit_input from this player.
              0 = ChooseType, 2 = ChooseTarget. PlayDrawn (1) is retired: a
              playable voluntary draw now holds the turn and is resolved by
              match_play_card or match_keep_drawn, no prompt input.
          action_context:
            type: object
            description: Additional context for the required action (e.g. available colours).

    MatchOver:
      name: match_over
      title: Match Ended
      payload:
        type: object
        properties:
          action:
            type: string
            enum: ["match_over"]
          winner:
            type: string
            description: Username of the winning player, or empty string if match was abandoned.
          reason:
            type: string

    # INFO: The wire action string is `match_event` (underscore), not the
    #       prose `match.event`, because both codegens derive identifiers by
    #       splitting on `_`; a dotted name would emit invalid C++/TS
    #       identifiers (e.g. kMatch.event). The event family stays
    #       `match.event` in prose; the packet discriminator is the envelope's
    #       `type` field.
    MatchEvent:
      name: match_event
      title: Match Event (ordered event-stream envelope)
      description: >
        Ordered per-match event packet. FORWARD-COMPAT
        (normative): unknown packet discriminator values MUST be ignored by
        clients, never treated as errors. Envelope fields, ordering/gap rules,
        the packet registry, and payload versioning (x-packet-v1) are defined
        on the MatchEventPayload schema.
      payload:
        $ref: "#/components/schemas/MatchEventPayload"

    ChatMessage:
      name: chat_message
      title: Incoming Chat Message
      payload:
        type: object
        required: [action, username, message, channel]
        properties:
          action:
            type: string
            enum: ["chat_message"]
          username:
            $ref: "#/components/schemas/Username"
          message:
            type: string
            maxLength: 512
          channel:
            type: string
            enum: ["global", "lobby", "dm"]
          target:
            $ref: "#/components/schemas/Username"
            description: Present only when channel == "dm" — the other DM participant.

    ChatHistory:
      name: chat_history
      title: Chat History Shard (DM/lobby response to chat_history_request, or global on-join/scroll-back push)
      payload:
        type: object
        required: [action, channel, messages, has_more]
        properties:
          action:
            type: string
            enum: ["chat_history"]
          request_id:
            type: string
            description: Absent (unsolicited) only for the global on-join push — every requested shard, including scroll-back for "global", echoes the request's id.
          channel:
            type: string
            enum: ["global", "lobby", "dm"]
            description: Distinguishes an on-join global history push from a lobby/DM history reply.
          target:
            $ref: "#/components/schemas/Username"
            description: The other DM participant this history belongs to — present only when channel == "dm".
          has_more:
            type: boolean
            description: True if older messages exist beyond this shard — pass the oldest message's `id` as `before_id` to fetch the next one.
          messages:
            type: array
            description: One shard, oldest message first.
            items:
              type: object
              required: [id, username, message]
              properties:
                id:
                  type: integer
                  description: Monotonic per-channel-pair id — use the oldest one as the next request's `before_id`.
                username:
                  $ref: "#/components/schemas/Username"
                message:
                  type: string
                  maxLength: 512

    FriendList:
      name: friend_list
      title: Friends List Broadcast
      payload:
        type: object
        required: [action, friends, incoming_requests, outgoing_requests]
        properties:
          action:
            type: string
            enum: ["friend_list"]
          request_id:
            type: string
          friends:
            type: array
            items:
              type: object
              required: [username, online]
              properties:
                username:
                  $ref: "#/components/schemas/Username"
                online:
                  type: boolean
          incoming_requests:
            type: array
            items:
              $ref: "#/components/schemas/Username"
          outgoing_requests:
            type: array
            items:
              $ref: "#/components/schemas/Username"

    # --- Client → Server (payloads reference components/schemas for code generation) ---

    MatchPlayCard:
      name: match_play_card
      title: Play a Card
      payload:
        $ref: "#/components/schemas/GamePlayCardPayload"

    DirectorCommand:
      name: director_command
      title: Director Control
      payload:
        $ref: "#/components/schemas/GameDirectorCommandPayload"

    MatchDrawCard:
      name: match_draw_card
      title: Draw a Card
      payload:
        type: object
        properties:
          action:
            type: string
            enum: ["match_draw_card"]
          request_id:
            type: string

    MatchKeepDrawn:
      name: match_keep_drawn
      title: Keep the Drawn Card
      description: >
        Owner-only resolution of a playable voluntary draw: clear the parked
        play/keep choice and advance the turn, leaving the drawn card in hand.
        Replaces the retired Action.PlayDrawn prompt input. Empty payload.
      payload:
        type: object
        properties:
          action:
            type: string
            enum: ["match_keep_drawn"]
          request_id:
            type: string

    MatchClientReady:
      name: match_client_ready
      title: Client Finished Loading
      payload:
        type: object
        properties:
          action:
            type: string
            enum: ["match_client_ready"]

    MatchSnapshotRequest:
      name: match_snapshot_request
      title: Request A New Snapshot (after a sequence gap)
      description: >
        Sent by a client that sees a gap in the `sequence` of its client
        events. The server answers with `match_state_updated`; its
        `seq_watermark` is the `sequence` of the next packet for this
        recipient. The server rate limits the request per recipient (default
        one per 1000 ms, environment variable
        `SNAPSHOT_REQUEST_MIN_INTERVAL_MS`); a request inside the interval
        gets no answer. Empty payload.
      payload:
        type: object
        properties:
          action:
            type: string
            enum: ["match_snapshot_request"]

    MatchSubmitInput:
      name: match_submit_input
      title: Submit Mandatory Input (e.g. colour choice)
      payload:
        $ref: "#/components/schemas/GameSubmitInputPayload"

    MatchPromptResponse:
      name: match_prompt_response
      title: Prompt Response (generic prompt envelope reply)
      description: >
        Client response to a prompt opened by a `prompt_opened` event packet.
        `value` is an arbitrary JSON value validated server-side against the
        prompt's response_schema. ADDITIVE: coexists with match_submit_input /
        the Action enum, which the new engine no longer uses.
      payload:
        $ref: "#/components/schemas/MatchPromptResponsePayload"

    MatchWindowResponse:
      name: match_window_response
      title: Window Response (pass or play a card into the open window)
      description: >
        Client reply to a `window_opened` event packet. `pass`
        true declines the window (the Pass button); otherwise
        `card_id` (CompactCardV2.bits) plays a response card. `window_id` is
        informational and currently ignored by the server.
      payload:
        $ref: "#/components/schemas/MatchWindowResponsePayload"

    MatchExit:
      name: match_exit
      title: Exit Match
      payload:
        type: object
        properties:
          action:
            type: string
            enum: ["match_exit"]
          request_id:
            type: string

    LobbyListRequest:
      name: lobby_list
      title: Request Public Lobby List
      payload:
        type: object
        properties:
          action:
            type: string
            enum: ["lobby_list"]
          request_id:
            type: string

    LobbyCreate:
      name: lobby_create
      title: Create a Lobby
      payload:
        $ref: "#/components/schemas/LobbyCreatePayload"

    LobbyJoin:
      name: lobby_join
      title: Join a Lobby via Invite Code
      payload:
        $ref: "#/components/schemas/LobbyJoinPayload"

    LobbyRejoin:
      name: lobby_rejoin
      title: Rejoin After Disconnection
      payload:
        $ref: "#/components/schemas/LobbyRejoinPayload"

    LobbyQuickJoin:
      name: lobby_quick_join
      title: Join the Fullest Open Public Lobby
      payload:
        type: object
        properties:
          action:
            type: string
            enum: ["lobby_quick_join"]
          request_id:
            type: string

    LobbyLeave:
      name: lobby_leave
      title: Leave Current Lobby
      payload:
        type: object
        properties:
          action:
            type: string
            enum: ["lobby_leave"]
          request_id:
            type: string

    LobbyToggleReady:
      name: lobby_toggle_ready
      title: Toggle Your Ready State
      payload:
        type: object
        properties:
          action:
            type: string
            enum: ["lobby_toggle_ready"]
          request_id:
            type: string

    LobbyPromote:
      name: lobby_promote
      title: Hand Host Role to Another Player
      payload:
        $ref: "#/components/schemas/LobbyPromotePayload"

    LobbyKick:
      name: lobby_kick
      title: Kick a Player (Host Only)
      payload:
        $ref: "#/components/schemas/LobbyKickPayload"

    LobbyUpdateSettings:
      name: lobby_update_settings
      title: Update Lobby Settings (Host Only)
      payload:
        $ref: "#/components/schemas/LobbyUpdateSettingsPayload"

    LobbyStartMatch:
      name: lobby_start_match
      title: Start the Match
      payload:
        type: object
        properties:
          action:
            type: string
            enum: ["lobby_start_match"]
          request_id:
            type: string

    ChatSend:
      name: chat_send
      title: Send a Chat Message
      payload:
        $ref: "#/components/schemas/ChatSendPayload"

    ChatHistoryRequest:
      name: chat_history_request
      title: Request a Shard of DM or Global Chat History
      payload:
        $ref: "#/components/schemas/ChatHistoryRequestPayload"

    FriendRequest:
      name: friend_request
      title: Send a Friend Request
      payload:
        $ref: "#/components/schemas/FriendRequestPayload"

    FriendResponse:
      name: friend_response
      title: Accept or Decline a Friend Request
      payload:
        $ref: "#/components/schemas/FriendResponsePayload"

    FriendListRequest:
      name: friend_list_request
      title: Request Current Friends List
      payload:
        type: object
        properties:
          action:
            type: string
            enum: ["friend_list_request"]
          request_id:
            type: string

    MetadataRequest:
      name: metadata_request
      title: Request Server Metadata (rule catalog)
      payload:
        type: object
        properties:
          action:
            type: string
            enum: ["metadata_request"]
          request_id:
            type: string

    UserUpdatePrivacy:
      name: user_update_privacy
      title: Update Player Privacy Mode
      payload:
        $ref: "#/components/schemas/UserUpdatePrivacyPayload"

    SpectatorView:
      name: spectator_view
      title: Report the Player a Spectator Is Watching
      payload:
        $ref: "#/components/schemas/SpectatorViewPayload"

  # -------------------------------------------------------------------------
  # Schemas
  # -------------------------------------------------------------------------
  # Only client → server payload schemas live here; they are used for C++ code
  # generation via hatchbed/asyncapi_gencpp. Server response payloads are
  # described inline in their message definitions above.
  #
  # Constraint schemas (Username, Password, etc.) are included for frontend
  # Zod generation and are referenced by the payload schemas below.
  # -------------------------------------------------------------------------
  schemas:
    # --- Constraint schemas (single source of truth for validation limits) ---
    # These limits are code-generated into both ends — never hand-edit the
    # mirrors. Backend: scripts/generate_contract_hpp.py -> common/contract.hpp
    # (contract::k...). Frontend: scripts/generate-schemas.js -> schemas.ts.

    # INFO: engine-owned values of a warm-up snapshot. A client reads them and
    #       computes nothing from client events (spec "Snapshot and late join").
    SnapshotContext:
      type: object
      required:
        - active_color
        - direction
        - draw_debt
        - hold
        - timers
        - last_event_sequence
        - streaks
      properties:
        active_color:
          type: [string, "null"]
          description: The color that a play must match. Null when none.
        direction:
          type: integer
          description: Play direction, 1 clockwise and -1 counter-clockwise.
        draw_debt:
          type: integer
          description: >
            Draw debt that one seat holds, 0 when none. It follows the rule
            of `status_applied`: a hidden `uni:draw_debt` status counts only
            for the seat that owns it. Another seat and a spectator get the
            sum of the visible statuses. The old top-level `pending_draws`
            field is unchanged and still counts hidden debt.
        hold:
          description: >
            The play-drawn hold, or null. All recipients get `player` and
            `held`; only the owner of the drawn card gets `card`.
          oneOf:
            - type: "null"
            - type: object
              required: [player, held]
              properties:
                player:
                  type: string
                held:
                  type: boolean
                card:
                  type: integer
                  description: Compact card bits. Owner only.
        timers:
          type: object
          description: >
            Live timers on the clock of `server_now_ms`. A remaining time of 0
            means no time is left or no timer runs. While a window is open the
            turn clock is suspended: `turn_deadline_ms` is 0 and
            `turn_remaining_ms` holds the time that is left for the turn.
          required:
            - turn_deadline_ms
            - turn_remaining_ms
            - window_deadline_ms
            - window_remaining_ms
          properties:
            turn_deadline_ms: { type: integer }
            turn_remaining_ms: { type: integer }
            window_deadline_ms: { type: integer }
            window_remaining_ms: { type: integer }
        last_event_sequence:
          type: [integer, "null"]
          description: >
            The `sequence` of the last client event that this recipient
            received. Null before the first event. The next live event has
            this value plus one. `seq_watermark` is that next value.
        streaks:
          type: object
          description: >
            The current value of every `uni` streak, by streak id (for
            example `uni:skip_run`). A client reads the same values as a
            continuous player read from the envelope `context`. The values
            are public to all seats and spectators.
          additionalProperties:
            $ref: "#/components/schemas/StreakValue"
        near_win:
          type: object
          description: >
            The derived event windows, keyed by the event id that opens them
            (`near_win_entered`). The windows are engine-owned state, not
            streak values: closing a window compares an event with the seat
            of the window. `blocked` has no state of its own; it reads the
            window. A late joiner shows the same near-win cue as a
            continuous player from this object and from the tail.
          additionalProperties:
            $ref: "#/components/schemas/DerivedWindow"

    Username:
      type: string
      minLength: 3
      maxLength: 32
      pattern: "^[a-zA-Z0-9_]+$"
      x-constants: { minLength: UsernameMin, maxLength: UsernameMax }

    PlayerRef:
      type: string
      minLength: 1
      maxLength: 100

    Password:
      type: string
      minLength: 8
      x-constants: { minLength: PasswordMin }

    LobbyName:
      type: string
      minLength: 1
      maxLength: 50
      x-constants: { maxLength: LobbyNameMax }

    LobbyCode:
      type: string
      minLength: 6
      maxLength: 6
      pattern: "^[A-Z0-9]+$"
      x-constants: { minLength: LobbyCodeLen }

    LobbyMemberCap:
      type: integer
      minimum: 1
      maximum: 16
      description: >
        Absolute upper bound on players (humans + bots) per lobby, mirrored at
        runtime by the ABSOLUTE_MAX_LOBBY_MEMBERS env var (same default).
        Individual lobbies enforce their own, lower LobbySettings.max_players
        instead of this constant directly.
      x-constants: { maximum: MaxLobbyMembers }

    # Mod content API version. A mod manifest's `api` field is rejected when
    # it exceeds this value; bumping the content schema bumps this constant
    # (frontend: MOD_API_VERSION, backend: contract::kModApiVersion).
    ModApiVersion:
      type: integer
      minimum: 2
      description: >
        Highest mod content API version this engine accepts. Starts at 1 and
        lives with the generated contract constants. Bumped to 2 for
        `entities/` and `presentations/` (a mod using them must not load on an
        engine that would silently ignore the directories).
      x-constants: { minimum: ModApiVersion }

    # --- Client → Server payload schemas (C++ structs generated from these) ---
    # Fields 'action' and 'request_id' are envelope fields handled by the router
    # and are intentionally excluded from these struct definitions.

    GamePlayCardPayload:
      type: object
      required:
        - card_id
      properties:
        card_id:
          type: integer
          minimum: 0
          description: >
            CompactCardV2.bits of the card to play (uint32 identity:
            mod/kind/instance), not a 16-bit legacy id.

    GameDirectorCommandPayload:
      type: object
      required:
        - op
      properties:
        op:
          type: string
          description: >
            Whitelisted director operation name, e.g. materialize_card.
        args:
          type: object
          additionalProperties: true
          description: Operation arguments passed to OpRuntime Invoke.
        request_id:
          type: string

    GameSubmitInputPayload:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          description: >
            The player's response to a mandatory game prompt, encoded as a string.
            Semantics depend on the pending Action:
              - ChooseType (0): integer string "0"–"3" mapping to the Type enum (Red=0, Blue=1, Green=2, Yellow=3).
              - ChooseTarget (2): the target player's username string.
              PlayDrawn (1) is retired and no longer sent; a playable voluntary
              draw is resolved by match_play_card or match_keep_drawn.

    LobbyCreatePayload:
      type: object
      properties:
        is_public:
          type: boolean
        name:
          $ref: "#/components/schemas/LobbyName"

    LobbyJoinPayload:
      type: object
      required:
        - code
      properties:
        code:
          $ref: "#/components/schemas/LobbyCode"

    LobbyRejoinPayload:
      type: object
      required:
        - code
      properties:
        code:
          $ref: "#/components/schemas/LobbyCode"

    LobbyPromotePayload:
      type: object
      required:
        - username
      properties:
        username:
          $ref: "#/components/schemas/PlayerRef"

    LobbyKickPayload:
      type: object
      required:
        - username
      properties:
        username:
          $ref: "#/components/schemas/PlayerRef"

    LobbyUpdateSettingsPayload:
      type: object
      properties:
        is_public:
          type: boolean
        ranked:
          type: boolean
          description: When false, match is excluded from leaderboard stats.
        creative:
          type: boolean
          description: Creative mode. Forces ranked off.
        scene:
          type: string
          description: Dev-only Creative scene file applied at match start.
        name:
          $ref: "#/components/schemas/LobbyName"
        bot_count:
          type: integer
          minimum: 0
          # One less than LobbyMemberCap's maximum: a lobby always needs at
          # least one human seat, so the absolute bot ceiling is
          # MaxLobbyMembers - 1. Per-lobby settings.max_players clamps this
          # further at runtime (see LobbySettings::Sanitize/AdjustBots).
          maximum: 15
          x-constants: { minimum: BotCountMin, maximum: BotCountMax }
        turn_time_limit_ms:
          type: integer
          minimum: 3000
          maximum: 120000
          description: Turn time limit in milliseconds.
          x-constants: { minimum: TurnTimeMinMs, maximum: TurnTimeMaxMs }
        allow_bot_takeover:
          type: boolean
        allow_bot_replacement:
          type: boolean
        quit_deletes_match:
          type: boolean
        bot_mode:
          type: integer
          minimum: 0
          maximum: 1
          x-constants: { minimum: BotModeMin, maximum: BotModeMax }
        starting_cards:
          type: integer
          minimum: 2
          maximum: 20
          x-constants: { minimum: StartingCardsMin, maximum: StartingCardsMax }
        mode:
          type: string
          enum: ["standard", "race"]
          description: Game mode (standard or race).
        race_percent:
          type: integer
          minimum: 5
          maximum: 95
          multipleOf: 5
          default: 50
          description: >-
            Race mode only. Percent of seated players that must empty their
            hand for the match to end (rounded up, at least 1 and at most
            seats - 1).
          x-constants:
            minimum: RacePercentMin
            maximum: RacePercentMax
            multipleOf: RacePercentStep
            default: RacePercentDefault
        active_mods:
          type: array
          items:
            type: string
        deck_id:
          type: string
          description: >-
            Deck catalog id (namespace:id or bare id); empty string clears to
            freestyle.

    ChatSendPayload:
      type: object
      required:
        - message
        - channel
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 512
        channel:
          type: string
          enum: ["global", "lobby", "dm"]
        target:
          $ref: "#/components/schemas/Username"
          description: Required when channel == "dm" — the recipient's username.

    ChatHistoryRequestPayload:
      type: object
      properties:
        channel:
          type: string
          enum: ["global", "lobby", "dm"]
          description: Defaults to "dm" when omitted. "lobby" uses the requester's current lobby membership — target is ignored.
        target:
          $ref: "#/components/schemas/Username"
          description: Required when channel == "dm" — the other DM participant.
        before_id:
          type: integer
          description: Cursor — request messages older than this id. Omit to fetch the most recent shard.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Requested page size. Always clamped server-side; server default applies when omitted.

    FriendRequestPayload:
      type: object
      required:
        - username
      properties:
        username:
          $ref: "#/components/schemas/Username"

    FriendResponsePayload:
      type: object
      required:
        - username
        - accept
      properties:
        username:
          $ref: "#/components/schemas/Username"
        accept:
          type: boolean

    AnimationSequence:
      type: object
      description: >
        NOT YET emitted by any message — reserved for a future server-push
        animation event once the moddable ruleset engine exists. Documented
        here for the schema's own versioning; the authoritative TypeScript
        types are hand-written in
        frontend/src/lib/components/game/animation/types.ts (this generator
        does not code-generate server-push shapes — see LobbyList/ListedLobby
        for the existing precedent).
      required: [version, beats]
      properties:
        version:
          type: integer
          description: >
            Schema version. Evolve additively (new optional fields, new op
            values); never repurpose an existing field.
        beats:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/AnimationStep"

    AnimationStep:
      type: object
      required: [op, target]
      properties:
        op:
          type: string
          description: >
            Renderer key. Unknown ops (client older than schema version) must
            no-op, not fail the sequence.
        target:
          type: string
          description: Card id, player/seat id, or the literal "screen".
        payload:
          type: object
          description: >
            Op-specific fields (e.g. move's destination slot, screenEffect's
            effect name and duration).
        groupId:
          type: string
          description: >
            Optional grouping key. Steps in a beat sharing a groupId are placed
            at the group's first atS (in array order) and their timelines added
            at that shared position; absent, each step uses its own atS within
            the beat.

    UserUpdatePrivacyPayload:
      type: object
      required:
        - action
        - privacy_mode
      properties:
        action:
          type: string
          enum: ["user_update_privacy"]
        request_id:
          type: string
        privacy_mode:
          type: boolean
          description: >-
            Whether Streamer/Privacy Mode is enabled. When true, a spectator
            sees card backs for the seat of this player; when false, a
            spectator sees the hidden cards of the seat. The server saves the
            value for an account (default false) and keeps it for the socket
            session of a guest. The change reaches a spectator at the next
            client event.

    SpectatorViewPayload:
      type: object
      properties:
        action:
          type: string
          enum: ["spectator_view"]
        request_id:
          type: string
        viewed_username:
          type: string
          description: >
            Username of the player whose POV this spectator is currently
            viewing. An empty string means "no explicit choice" — the server
            attributes the spectator to whoever's turn it is.

    # --- Event-stream packet payloads -----------------------
    # The MatchEvent envelope is the client event envelope. The named *Payload
    # schemas below describe the inner `payload` object for each packet `id`.
    #
    # Versioning convention (x-packet-v1): every packet payload schema carries
    # a top-level `x-packet-version: "1"` marker. Evolve payloads additively;
    # bump the marker only on a breaking change. Clients MUST ignore unknown
    # `id` strings (and unknown trailing fields) without error.

    # Event-stream envelope. The MatchEvent message references this schema.
    # Each recipient has its own `sequence`. It grows by one for each packet
    # that this recipient receives, and session packets (prompts, defs, ...)
    # use the same counter. An event that goes to one seat only never makes a
    # gap for another seat. On a `sequence` gap the client flushes its
    # animation queue, sends `match_snapshot_request`, and reconciles from the
    # snapshot. `cause` is the `sequence` of the causing client event as this
    # recipient knows it. It is absent when there is no cause or when the
    # recipient cannot see the causing event. `actor` is the username of the
    # seat that caused the event. It is absent for a table event.
    # FORWARD-COMPAT (normative): unknown `id` strings MUST be ignored by
    # clients, never treated as errors. The valid `id` values are pinned by
    # components.x-packet-types; the inner payload shape per `id` is
    # described by the named *Payload schemas below, versioned by name via the
    # x-packet-v1 marker (`x-packet-version: "1"`); new packet ids are added
    # additively.
    #
    # WARN: `payload` (here, and the same for SignalPayload.payload and
    #       PromptOpenPayload.payload) is intentionally opaque: the external
    #       asyncapi_gencpp maps `additionalProperties: true` to an EMPTY C++
    #       struct, so the generated Payload type neither serializes nor
    #       parses its contents (toJson() -> `{}`, fromJson() discards). Do NOT
    #       assume the C++ generated struct round-trips this field; consumers
    #       must carry/parse raw JSON for it (the view layer and the session
    # layer). WARN: `sequence` is a uint32 on the wire but asyncapi_gencpp
    #       emits every integer as C++ `int` (32-bit signed), so the
    #       4294967295 maximum does not fit and the generated range check is
    #       inert. The view layer and the controller must handle the uint32
    #       range explicitly (carry raw JSON or widen); no schema change is
    #       made here.
    StreakValue:
      description: >
        The value of one streak. A `run` streak and an ungrouped `total`
        streak give an integer. A grouped `total` streak gives an object
        from group to count. A `last_value` streak gives an object with
        `last` and `previous`. A streak reads payload fields with the
        audience `all` only, so a value never holds hidden information.
      oneOf:
        - type: integer
          minimum: 0
        - type: object
          additionalProperties: true

    DerivedWindow:
      type: object
      required: [target, open]
      properties:
        target:
          type: [string, "null"]
          description: >
            The seat of the last window. Null until a window opens. It stays
            after the window closes.
        open:
          type: boolean
          description: True while the window is open.

    StreakContext:
      type: object
      description: >
        The streak values that an event asked for (`uni:context`, and a
        table of core events in `event_audience.hpp`: `direction_changed`
        asks for `uni:reverse_run`, `turn_skipped` asks for
        `uni:skip_run`, `cards_drawn` asks for `uni:draw_run` and
        `uni:total_draws`, `active_type_changed` asks for `uni:wild_run` and
        `uni:last_wild_color`). The value is the value AFTER the event. The
        object is public to every seat and spectator. It is absent when the
        event asks for nothing. The size is at most `UNI_CONTEXT_SIZE_MAX`
        bytes (default 512).
      additionalProperties:
        $ref: "#/components/schemas/StreakValue"

    MatchEventPayload:
      type: object
      x-packet-version: "1"
      required: [sequence, id, payload]
      properties:
        sequence:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: >
            Per-recipient sequence number (uint32); gap-free per recipient.
            Generated C++ type is `int` (see WARN above).
        id:
          type: string
          description: >
            Namespaced name of what happened. Unknown values MUST be ignored
            by clients.
        actor:
          type: string
          description: Username of the seat that caused the event.
        cause:
          type: integer
          minimum: 0
          maximum: 4294967295
          description: >
            The `sequence` of the causing client event, in the sequence space
            of this recipient. Absent when the recipient cannot see it.
        turn:
          type: integer
          minimum: 0
          description: The turn number of the event.
        round:
          type: integer
          minimum: 0
          description: The round number of the event.
        context:
          $ref: "#/components/schemas/StreakContext"
        replayed:
          type: boolean
          description: >
            True on an envelope of the snapshot `tail` (a replayed client
            event); absent on a live event. A replayed event is stale: it
            must not start an animation, a sound or a timer (a replayed
            `turn_advance` holds the deadline of its time, and the live timer
            state is in `context.timers`), and it never opens the play-drawn
            hold (that is `context.hold`). Retention of a core event is set by
            the engine in one table (`event_audience.hpp`): `transient` is
            never replayed; `until_turn_end` is dropped when the turn counter
            changes; `until_round_end` when the round counter changes; `log`
            is kept up to `UNI_EVENT_TAIL_MAX` events (default 200). A turn
            ends at the engine turn advance (the `turn_advance` event and the
            `turn` counter). A jump-in and an extra turn raise the counter
            too: an event belongs to the `turn` value that the engine stamped
            at emit time, and it is dropped when the counter next changes. A
            mod event is `log` by default.
        payload:
          type: object
          additionalProperties: true
          description: Id-specific payload object (see the named *Payload schemas).

    # Compact wire identity: bits 31..24 mod_index, 23..12
    # kind_index, 11..0 instance_id. Serialized as a plain integer.
    CompactCardV2:
      type: integer
      minimum: 0
      maximum: 4294967295

    # Per-mod entry in the frozen match mod list.
    ModDef:
      type: object
      required: [id, version, index]
      properties:
        id:
          type: string
        version:
          type: string
        hash:
          type: string
          description: >
            SHA-256 (lowercase hex) of the files of the mod in a canonical
            order. The client cache is keyed by `version` and `hash`. Absent
            from a server that predates it.
        index:
          type: integer
          minimum: 0
          maximum: 255
          description: Position of this mod in the frozen match mod list (8-bit on the wire).
        texts:
          type: array
          description: >
            The texts files of the mod, one for each locale. Absent when the
            mod has none. The client fetches only the active locale and `en`
            from `/assets/{mod}/texts/{locale}/low/{hash}`, where the hash in
            the URL is the first 16 hex characters of `hash`. The client
            checks the SHA-256 of the bytes against `hash` before it parses the
            file.
          items:
            $ref: "#/components/schemas/ModTextsFile"
        glossary:
          type: array
          description: >
            The glossary entries of the mod, sorted by id: one automatic entry
            for each card definition, and the explicit entries of the
            `glossary` files (an explicit entry replaces the automatic entry
            with the same id). An entry holds translation keys only; the
            client resolves the texts through the texts files of the same mod.
            Absent when the mod has no entry. The client ignores an entry
            whose id is outside the namespace of the listing mod.
          items:
            $ref: "#/components/schemas/ModGlossaryEntry"

    ModGlossaryEntry:
      type: object
      required: [id, label_key, description_key, source]
      properties:
        id:
          type: string
          description: Full entry id, `namespace:name`; the namespace is the mod id.
        label_key:
          type: string
          description: Translation key of the label.
        description_key:
          type: string
          description: Translation key of the description.
        source:
          type: string
          enum: [card, explicit]
          description: >
            `card` for the automatic entry of a card definition, `explicit`
            for an entry of a `glossary` file.

    ModTextsFile:
      type: object
      required: [locale, hash, size]
      properties:
        locale:
          type: string
          description: Locale tag from the file name, for example `en` or `pt-BR`.
        hash:
          type: string
          description: SHA-256 (lowercase hex) of the bytes of the file.
        size:
          type: integer
          minimum: 0
          description: Size of the file in bytes (at most 262144).

    # Per-kind entry in the flattened card kind table (`defs` packet).
    KindDef:
      type: object
      required: [index, string_id, face, tags]
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 4095
        string_id:
          type: string
        face:
          type: object
          additionalProperties: true
          description: >
            Face definition. Opaque on the
            wire; `slots` carries the resolved asset variants so the client
            needs no extra round trip and no filesystem knowledge (only ids +
            content hashes).
          properties:
            kind:
              type: string
              enum: [text, image, emoji, blank]
            color:
              type: string
            label:
              type: string
            art:
              type: string
              description: Asset bundle id; `kind` selects the slot.
            art_mode:
              type: string
              enum: [inset, replace, overlay]
            art_fit:
              type: string
              enum: [contain, cover, stretch]
            keep:
              type: array
              items:
                type: string
                enum: [value, border]
            art_version:
              type: integer
              minimum: 0
            slots:
              type: object
              additionalProperties: true
              description: >
                Resolved per-slot variants: slot name to an array of
                `{tier, url, hash}` (file variants) or `{tier, value}`
                (glyph variants).
        tags:
          type: array
          items:
            type: string

    # Per-entity entry in the `defs` packet. Hash-addressed:
    # `def_hash` is the stable digest of the canonical def, so the client
    # caches by content and reloads only what changed.
    EntityDef:
      type: object
      required: [id, def_hash, components]
      properties:
        id:
          type: string
          description: Full `namespace:local` id.
        def_hash:
          type: string
        components:
          type: object
          additionalProperties: true
          description: >
            Component name to its verbatim parameter object; the client entity runtime interprets them.

    # Per-event entry in the `defs` packet. The field audiences stay on the
    # server.
    EventDefinitionManifest:
      type: object
      required: [id, def_hash, retention, fields]
      properties:
        id:
          type: string
          description: Full `namespace:name` id of the mod event.
        def_hash:
          type: string
        retention:
          type: string
          enum: [transient, until_turn_end, until_round_end, log]
        fields:
          type: array
          items:
            type: object
            required: [name, type]
            properties:
              name:
                type: string
              type:
                type: string
                enum: [seat, color, integer, number, boolean, string]
        context:
          type: array
          items:
            type: string

    # Per-presentation entry in the `defs` packet.
    PresentationDef:
      type: object
      required: [id, def_hash, target, modifiers]
      properties:
        id:
          type: string
          description: Full `namespace:local` id.
        def_hash:
          type: string
        target:
          type: string
        priority:
          type: integer
        modifiers:
          type: array
          items:
            type: object
            additionalProperties: true
        triggers:
          type: array
          items:
            type: object
            additionalProperties: true

    PresentationBindingDef:
      type: object
      description: >
        An entry of `defs.presentations[]`. It is either an old-style
        PresentationDef (keys `target`, `modifiers`) or a presentation binding
        (key `uni:binding`), so only `id` and `def_hash` are required here.
        One presentation binding (format version 1). The verbatim file object
        with `id` set to the full `namespace:local` id. The shape is
        `contract/schemas/bindings.schema.json`: the keys `uni:format_version`
        and `uni:binding` stay in the open object, because a key with a colon
        cannot be a generated struct member. The data is static and public:
        it holds no audience and no event value. The matcher runs on the
        client, on the event as the server projected it for the viewer.
      required: [id, def_hash]
      additionalProperties: true
      properties:
        id:
          type: string
          description: Full `namespace:local` id.
        def_hash:
          type: string

    MatchStartPayload:
      type: object
      x-packet-version: "1"
      required: [defs_digest, mods, deck_id, deck_name, settings]
      properties:
        defs_digest:
          type: string
        mods:
          type: array
          items:
            $ref: "#/components/schemas/ModDef"
        deck_id:
          type: string
        deck_name:
          type: string
        settings:
          type: object
          additionalProperties: true

    PlayersReadyPayload:
      type: object
      x-packet-version: "1"
      required: [ready, total]
      properties:
        ready: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        timeout_ms:
          type: integer
          minimum: 0
          description: >
            Milliseconds left before the server opens the barrier regardless
            of stragglers. Omitted when no timeout is armed.

    MatchBeginPayload:
      type: object
      x-packet-version: "1"
      properties: {}

    DefsPayload:
      type: object
      x-packet-version: "1"
      # INFO: `entities`/`presentations` are deliberately NOT required. They are
      # additive and the server always emits them, but a client must
      # tolerate a frame from an engine that predates them (degrade to absent,
      # never fail validation).
      required: [defs_digest, mods, kinds]
      properties:
        defs_digest:
          type: string
        mods:
          type: array
          items:
            $ref: "#/components/schemas/ModDef"
        kinds:
          type: array
          items:
            $ref: "#/components/schemas/KindDef"
        entities:
          type: array
          items:
            $ref: "#/components/schemas/EntityDef"
        presentations:
          type: array
          description: >
            Two kinds in one array. An old-style presentation has `target` and
            `modifiers` (PresentationDef). A presentation binding has the key
            `uni:binding` (PresentationBindingDef) and binds a client event id
            to beats, sounds, a play log line, and a glossary key. The client
            tells them apart by that key.
          items:
            $ref: "#/components/schemas/PresentationBindingDef"
        events:
          type: array
          description: >
            Event definitions of the active mods. A client with no presentation
            for an event ignores it.
          items:
            $ref: "#/components/schemas/EventDefinitionManifest"

    CardPlayedPayload:
      type: object
      x-packet-version: "1"
      required: [player, card, from_zone_ordinal]
      properties:
        player:
          $ref: "#/components/schemas/PlayerRef"
        card:
          $ref: "#/components/schemas/CompactCardV2"
        from_zone_ordinal:
          type: integer
          minimum: 0
        tags:
          type: array
          description: Tags of the card kind. Optional, additive; no version bump.
          items:
            type: string

    PlayRejectedPayload:
      type: object
      x-packet-version: "2"
      required: [target, reason_id]
      properties:
        target:
          $ref: "#/components/schemas/PlayerRef"
          description: >
            The seat whose play the engine rejected. Only that seat receives
            the packet.
        reason_id:
          type: string

    CardsDrawnPayload:
      type: object
      x-packet-version: "2"
      required: [target, count, source_pile, hand_size_after, from_debt]
      properties:
        target:
          $ref: "#/components/schemas/PlayerRef"
          description: >
            The seat that draws. The envelope `actor` is the seat that caused
            the draw. The server always sends it.
        count:
          type: integer
          minimum: 0
        hand_size_after:
          type: integer
          minimum: 0
          description: >
            The size of the drawer hand after the draw. Public. The server
            always sends it.
        from_debt:
          type: boolean
          description: >
            True when the draw pays a draw debt. The size of the debt is the
            `magnitude` of the `uni:draw_debt` status event, not this event.
            The server always sends it.
        source_pile:
          type: string
        held:
          type: boolean
          description: >
            True when this single voluntary draw is held for the drawer's
            play-or-keep choice. Public: the hold is visible to every seat.
        cards:
          type: array
          description: Owner-only card identities; other viewers receive count only.
          items:
            $ref: "#/components/schemas/CompactCardV2"

    DrawnCardKeptPayload:
      type: object
      x-packet-version: "1"
      required: [target]
      properties:
        target:
          $ref: "#/components/schemas/PlayerRef"
          description: >
            The seat that kept the drawn card. The event ends the play-or-keep
            choice that a held `cards_drawn` opened. The clock can choose for
            the seat; the cause then reads turn_timer_expired. The envelope
            `actor` is that seat.
        card:
          $ref: "#/components/schemas/CompactCardV2"
          description: >
            The kept card. Owner only: other viewers receive no `card`.

    ReshufflePayload:
      type: object
      x-packet-version: "1"
      required: [draw_size, discard_size]
      properties:
        draw_size:
          type: integer
          minimum: 0
        discard_size:
          type: integer
          minimum: 0

    # The hand events carry seats and counts only. A hand count is public; the
    # cards of a hand are not, so no hand event names a card.
    HandsSwappedPayload:
      type: object
      x-packet-version: "2"
      required: [source, target, count, target_count]
      properties:
        source:
          $ref: "#/components/schemas/PlayerRef"
          description: >
            The seat that gives `count` cards to `target` (the op argument
            `a`). The envelope `actor` is the seat that caused the swap. It can
            differ from `source`, for example when a mod swaps two other seats.
        target:
          $ref: "#/components/schemas/PlayerRef"
          description: The other seat. It gives `target_count` cards back.
        count:
          type: integer
          minimum: 0
          description: Hand size of `source` before the swap.
        target_count:
          type: integer
          minimum: 0
          description: Hand size of `target` before the swap.

    HandsPassedPayload:
      type: object
      x-packet-version: "2"
      required: [direction, targets, counts]
      properties:
        direction:
          type: string
          enum: [forward, backward]
          description: >
            `forward` moves each hand to the next seat in `targets`, `backward`
            to the previous one (wrapping).
        targets:
          type: array
          items:
            $ref: "#/components/schemas/PlayerRef"
          description: Seats in order.
        counts:
          type: array
          items:
            type: integer
            minimum: 0
          description: Hand size of each seat before the pass, parallel to `targets`.

    HandsRedistributedPayload:
      type: object
      x-packet-version: "1"
      required: [targets, counts]
      properties:
        targets:
          type: array
          items:
            $ref: "#/components/schemas/PlayerRef"
          description: Seats in order.
        counts:
          type: array
          items:
            type: integer
            minimum: 0
          description: >
            Hand size of each seat after all hands were collected and dealt
            again, parallel to `targets`. No card identity is sent; a seat
            reads its new hand from the snapshot.

    CardMovedPayload:
      type: object
      x-packet-version: "1"
      required: [from_zone, to_zone]
      properties:
        card:
          $ref: "#/components/schemas/CompactCardV2"
          description: >
            The moved card. The server fixes who sees it when it emits the
            event: everyone for a move into the discard pile, else only the
            seat that owns the `target` hand. Nobody sees it for a move into
            the draw pile or limbo.
        from_zone:
          $ref: "#/components/schemas/CardZoneKind"
        to_zone:
          $ref: "#/components/schemas/CardZoneKind"
        source:
          $ref: "#/components/schemas/PlayerRef"
          description: The seat whose hand the card left. Absent for a pile.
        target:
          $ref: "#/components/schemas/PlayerRef"
          description: The seat whose hand the card entered. Absent for a pile.

    CardCreatedPayload:
      type: object
      x-packet-version: "1"
      required: [zone]
      properties:
        zone:
          $ref: "#/components/schemas/CardZoneKind"
        target:
          $ref: "#/components/schemas/PlayerRef"
          description: The seat whose hand got the card. Absent for a pile.

    CardRemovedPayload:
      type: object
      x-packet-version: "1"
      required: [from_zone]
      properties:
        card:
          $ref: "#/components/schemas/CompactCardV2"
          description: >
            The removed card. Owner only: the seat that lost the card, and the
            spectators of that seat when its privacy mode is off.
        from_zone:
          $ref: "#/components/schemas/CardZoneKind"
        target:
          $ref: "#/components/schemas/PlayerRef"
          description: The seat that lost the card. Absent for a pile.

    CardReplacedPayload:
      type: object
      x-packet-version: "1"
      required: [zone]
      properties:
        zone:
          $ref: "#/components/schemas/CardZoneKind"
        target:
          $ref: "#/components/schemas/PlayerRef"
          description: >
            The seat whose hand holds the card. Absent for a pile. The new
            identity is never sent; the snapshot carries it.

    CardZoneKind:
      type: string
      enum: [hand, draw_pile, discard_pile, limbo]

    StatusAppliedPayload:
      type: object
      x-packet-version: "1"
      required: [target, status_kind, magnitude, duration_unit, instance_id]
      properties:
        target:
          $ref: "#/components/schemas/PlayerRef"
        status_kind:
          type: string
        magnitude:
          type: integer
        duration_unit:
          type: string
          description: Duration unit (turns/rounds/cards/real_time) - never remaining ms.
        instance_id:
          type: integer

    StatusRemovedPayload:
      type: object
      x-packet-version: "1"
      required: [target, status_kind, instance_id]
      properties:
        target:
          $ref: "#/components/schemas/PlayerRef"
        status_kind:
          type: string
        instance_id:
          type: integer

    WindowOpenedPayload:
      type: object
      x-packet-version: "1"
      required: [window_id, targets, deadline_ms, eligible_filter_digest]
      description: >
        A response window opened. `targets` are the seats that may respond.
      properties:
        window_id:
          type: string
        kind:
          type: string
          pattern: "^[a-z0-9_:.-]{1,32}$"
        kinds:
          type: array
          items:
            type: string
            pattern: "^[a-z0-9_:.-]{1,32}$"
        targets:
          type: array
          items:
            $ref: "#/components/schemas/PlayerRef"
        deadline_ms:
          type: integer
          minimum: 0
          description: Ms REMAINING at the open.
        duration_ms:
          type: integer
          minimum: 0
        hold_ms:
          type: integer
          minimum: 0
        eligible_filter_digest:
          type: string

    WindowRespondedPayload:
      type: object
      x-packet-version: "1"
      required: [window_id, target]
      description: >
        A seat responded to a window. `target` is the seat that
        responded. A losing response hides `card` from every other seat.
        `window_kind` is the kind of the window. `outcome` is the result of
        the response.
      properties:
        window_id:
          type: string
        target:
          $ref: "#/components/schemas/PlayerRef"
        passed:
          type: boolean
        card:
          $ref: "#/components/schemas/CompactCardV2"
        window_kind:
          type: string
          pattern: "^[a-z0-9_:.-]{1,32}$"
        outcome:
          type: string
          enum: [winning, lost, pass]

    WindowClosedPayload:
      type: object
      x-packet-version: "1"
      required: [window_id, outcome]
      description: >
        A response window closed. `target` is the winning seat; it is
        absent when the window closed by default.
      properties:
        window_id:
          type: string
        outcome:
          type: string
          enum: ["default", "winner"]
        target:
          $ref: "#/components/schemas/PlayerRef"
        card:
          $ref: "#/components/schemas/CompactCardV2"

    AutoPlayedPayload:
      type: object
      x-packet-version: "1"
      required: [player, card, trigger_summary]
      properties:
        player:
          $ref: "#/components/schemas/PlayerRef"
        card:
          $ref: "#/components/schemas/CompactCardV2"
        trigger_summary:
          type: string
        tags:
          type: array
          description: Tags of the card kind. Optional, additive; no version bump.
          items:
            type: string

    # Generic prompt envelope. Mod manifests declare prompt
    # kinds by this shape; clients render unknown kinds from `response_schema`
    # (enum = buttons, integer range = stepper, boolean = toggle).
    PromptEnvelope:
      type: object
      x-packet-version: "1"
      required: [kind, payload, response_schema, timeout_ms]
      properties:
        kind:
          type: string
        payload:
          type: object
          additionalProperties: true
        response_schema:
          type: object
          additionalProperties: true
        timeout_ms:
          type: integer
          minimum: 0
        # INFO: untyped on purpose - `default` is a C++ keyword, so the C++
        #       codegen skips untyped properties; the value is any JSON scalar
        #       or object matching response_schema.
        default:
          description: Default value bound on timeout when present.

    PromptOpenedPayload:
      type: object
      x-packet-version: "1"
      required: [prompt_id, kind, payload, response_schema, deadline_ms]
      description: >
        A prompt opened. Only the seat that must answer receives it.
        `duration_ms` is the length of the prompt clock that the server
        enforces; `deadline_ms` is only the op's declared timeout (usually 0).
        The snapshot's `prompts` entries carry the same fields, with an
        absolute `deadline_ms` on the server clock.
      properties:
        duration_ms:
          type: integer
          minimum: 0
        prompt_id:
          type: string
        kind:
          type: string
        payload:
          type: object
          additionalProperties: true
        response_schema:
          type: object
          additionalProperties: true
        deadline_ms:
          type: integer
          minimum: 0

    PromptAnsweredPayload:
      type: object
      x-packet-version: "1"
      required: [prompt_id, outcome]
      description: >
        A prompt ended. `outcome` says how the prompt ended: answered, timed out, or cancelled.
      properties:
        prompt_id:
          type: string
        outcome:
          type: string
          enum: ["answered", "timed_out", "cancelled"]

    TurnAdvancePayload:
      type: object
      x-packet-version: "1"
      required: [from, to, direction, deadline_ms]
      properties:
        from:
          $ref: "#/components/schemas/PlayerRef"
        to:
          $ref: "#/components/schemas/PlayerRef"
        direction:
          type: integer
        deadline_ms:
          type: integer
          minimum: 0
        skipped:
          type: array
          description: >
            Usernames of seats that lost their turn to a consumed one-shot
            skip, in the order they were stepped over. Absent/empty on a plain
            advance. The client stamps an X over each before the incoming
            turn's highlight is presented.
          items:
            $ref: "#/components/schemas/PlayerRef"

    ModEventPayload:
      type: object
      x-packet-version: "1"
      additionalProperties: true
      description: >
        The `payload` of a mod event. The envelope `type` is `mod_event` and
        the envelope `id` is the namespaced id of the mod event, for example
        `my_mod:apple_eaten`. The keys are the payload fields that the event
        definition (`events/<name>.json`) declares. The server sends a field
        only to the seats in its declared audience; a field with no declared
        audience is never sent. A client with no presentation for the `id`
        ignores the event. The `sequence` rules are those of every other client
        event.

        WARN: the event id, the retention, the timing, and the field names
        and types (in the `defs` manifest) are public to every client. Do not
        put a hidden fact in them. A string value is at most 256 bytes and a
        payload at most 1024 bytes (`UNI_MOD_EVENT_PAYLOAD_MAX`); the server
        drops a larger event.

        The server also drops the extra mod events of a mod in one turn
        (`UNI_MOD_EVENTS_PER_TURN`, default 64) and the mod events beyond a
        cause chain of `UNI_MOD_CAUSE_CHAIN_MAX` (default 16). The sequence
        has no gap: a dropped event never gets a `sequence`. A mod that breaks
        a budget in `UNI_MOD_VIOLATION_TURNS` (default 3) distinct turns is
        disarmed. A core event is never dropped.

    DirectionChangedPayload:
      type: object
      x-packet-version: "1"
      required: [direction]
      properties:
        direction:
          type: integer
          description: >
            The play direction after the change: `1` forward, `-1` reverse. The
            envelope `actor` is the seat that caused the change.

    TurnSkippedPayload:
      type: object
      x-packet-version: "1"
      required: [target]
      properties:
        target:
          $ref: "#/components/schemas/PlayerRef"
          description: >
            The seat that lost its turn. The event marks the turn advance that
            skips it. The envelope `actor` is the seat that caused the skip.

    ExtraTurnGrantedPayload:
      type: object
      x-packet-version: "1"
      required: [target]
      properties:
        target:
          $ref: "#/components/schemas/PlayerRef"
          description: >
            The seat that gets an extra turn. The envelope `actor` is the seat
            that caused it.

    NearWinEnteredPayload:
      type: object
      x-packet-version: "1"
      required: [target]
      description: >
        A derived event (spec "Streaks and derived events"). The engine emits
        it right after the base event that left a seat with one card. The
        envelope `cause` is the `sequence` of that base event and the
        envelope `actor` is the seat that played. The retention is `log`.
        The seat is public: a hand count is public. A late joiner reads the
        open window in `context.near_win` of the snapshot.
      properties:
        target:
          $ref: "#/components/schemas/PlayerRef"
          description: The seat that has one card left.

    BlockedPayload:
      type: object
      x-packet-version: "1"
      required: [target]
      description: >
        A derived event. The engine emits it right after the base event
        (a skip or a forced draw) that hit the seat of the open near-win
        window. The engine reads the window as it was BEFORE the base event,
        so the same event can block and close the window. The envelope
        `cause` is the `sequence` of the base event. The envelope `actor` is
        the seat that caused it; when the base event has no actor, it is the
        seat that acted last. The retention is `log`.
      properties:
        target:
          $ref: "#/components/schemas/PlayerRef"
          description: The seat of the near-win window that was blocked.

    ActiveTypeChangedPayload:
      type: object
      x-packet-version: "1"
      required: [color, previous_color]
      properties:
        color:
          type: string
          description: The active color after the change. Empty when cleared.
        previous_color:
          type: string
          description: The active color before the change. Empty when none.

    RestrictionAddedPayload:
      type: object
      x-packet-version: "1"
      required: [restriction_id, phase]
      properties:
        restriction_id:
          type: string
        phase:
          type: string
          enum: ["allow", "deny"]
          description: >
            The condition of the restriction is mod data and is never sent.

    RestrictionRemovedPayload:
      type: object
      x-packet-version: "1"
      required: [restriction_id]
      properties:
        restriction_id:
          type: string

    TurnTimerChangedPayload:
      type: object
      x-packet-version: "1"
      required: [target, duration_ms]
      description: >
        A mod changed the turn timer of a seat with the `set_turn_timer` op.
        Only that op emits this event. The engine arms, suspends, resumes and
        resets the turn timer every turn and emits nothing for that; the
        client reads those deadlines from the turn and state packets.
      properties:
        target:
          $ref: "#/components/schemas/PlayerRef"
        duration_ms:
          type: integer
          minimum: 0
          description: >
            The new turn time in milliseconds. It is a relative duration, not
            an epoch time.

    RoundAdvancePayload:
      type: object
      x-packet-version: "1"
      required: [round]
      properties:
        round:
          type: integer
          minimum: 0

    SignalPayload:
      type: object
      x-packet-version: "1"
      required: [name, payload]
      properties:
        name:
          type: string
        payload:
          type: object
          additionalProperties: true

    VisibilityGrantedPayload:
      type: object
      x-packet-version: "1"
      required: [target, aspects]
      properties:
        target:
          $ref: "#/components/schemas/PlayerRef"
        aspects:
          type: array
          items:
            type: string

    VisibilityRevokedPayload:
      type: object
      x-packet-version: "1"
      required: [target, aspects]
      properties:
        target:
          $ref: "#/components/schemas/PlayerRef"
        aspects:
          type: array
          items:
            type: string

    OutcomeRolledPayload:
      type: object
      x-packet-version: "1"
      required: [roll_ordinal]
      description: >
        A dice roll or an outcome pick happened. A dice roll carries
        `spec` and `outcomes`; an outcome pick carries `table`, `key` and
        `value`. `roll_ordinal` counts the public rolls that this stream has
        received; it is never the engine counter, which also counts hidden
        draws.
      properties:
        spec:
          type: string
        outcomes:
          type: array
          items:
            type: integer
        table:
          type: string
        key:
          type: string
        value:
          type: integer
        roll_ordinal:
          type: integer
          minimum: 1

    StatusModifiedPayload:
      type: object
      x-packet-version: "1"
      required: [target, status_kind, magnitude, delta, instance_id]
      description: >
        A status changed its magnitude. A hidden status is sent to its
        target seat only, like `status_applied`.
      properties:
        target:
          $ref: "#/components/schemas/PlayerRef"
        status_kind:
          type: string
        magnitude:
          type: integer
        delta:
          type: integer
          description: The change that the op asked for, after the range clamp.
        instance_id:
          type: integer

    PlacementSetPayload:
      type: object
      x-packet-version: "1"
      required: [target, place, is_elimination]
      description: >
        A seat finished. `is_elimination` is false for a normal
        finish. No engine path sets it to true yet; it is the seam for a later
        elimination mechanic. `finished` is true when this place ends the
        race for that seat.
      properties:
        target:
          $ref: "#/components/schemas/PlayerRef"
        place:
          type: integer
          minimum: 1
        is_elimination:
          type: boolean
        finished:
          type: boolean

    MatchEndedPayload:
      type: object
      x-packet-version: "1"
      required: [target, targets, final_digest]
      description: >
        The match ended. `target` is the winner (empty when there
        is none). `targets` lists every placed seat, best first.
      properties:
        target:
          $ref: "#/components/schemas/PlayerRef"
        targets:
          type: array
          items:
            $ref: "#/components/schemas/PlayerRef"
        final_digest:
          type: string

    MatchWindowResponsePayload:
      type: object
      x-packet-version: "1"
      properties:
        window_id:
          type: string
          description: Id of the window being answered (informational).
        card_id:
          type: integer
          description: CompactCardV2.bits of the response card, when responding by play.
        pass:
          type: boolean
          description: True declines the open window (the Pass button).

    MatchPromptResponsePayload:
      type: object
      x-packet-version: "1"
      required: [prompt_id, value]
      properties:
        prompt_id:
          type: string
        value:
          x-any: true
          description: Validated server-side against the prompt's response_schema.

  # -------------------------------------------------------------------------
  # Enum definitions (shared between backend and frontend)
  # -------------------------------------------------------------------------
  # These are emitted by generate-schemas.js as TypeScript `as const` objects.
  # The C++ backend maps these values to its own `k`-prefixed enumerators
  # (e.g. Type::kRed = 0 <-> Type.Red = 0).
  # -------------------------------------------------------------------------
  x-enums:
    Type:
      description: Card type category (formerly Color). Transmitted as an integer index.
      values:
        Red:    { value: 0, display: "red" }
        Blue:   { value: 1, display: "blue" }
        Green:  { value: 2, display: "green" }
        Yellow: { value: 3, display: "yellow" }
        White:  { value: 4, display: "white" }

    Value:
      description: Card face value. Transmitted as an integer index.
      values:
        "0":        { value: 0,  display: "0" }
        "1":        { value: 1,  display: "1" }
        "2":        { value: 2,  display: "2" }
        "3":        { value: 3,  display: "3" }
        "4":        { value: 4,  display: "4" }
        "5":        { value: 5,  display: "5" }
        "6":        { value: 6,  display: "6" }
        "7":        { value: 7,  display: "7" }
        "8":        { value: 8,  display: "8" }
        "9":        { value: 9,  display: "9" }
        Skip:       { value: 10, display: "skip" }
        Reverse:    { value: 11, display: "reverse" }
        Draw2:      { value: 12, display: "+2" }
        Jolly:      { value: 13, display: "jolly" }
        JollyDraw4: { value: 14, display: "jolly_draw4" }

    Action:
      description: Input action the server is waiting for. Transmitted as an integer via action_required.
      values:
        ChooseType: 0
        # PlayDrawn (1) is retired: a playable voluntary draw now holds the
        # turn and is resolved by match_play_card / match_keep_drawn.
        ChooseTarget: 2

    ErrorCode:
      description: >
        Stable error identifiers carried in the `code` field of an error frame.
        The backend never sends user-facing prose; the frontend maps each code
        to a human-readable message. Transmitted as the snake_case wire string.
      values:
        InvalidPayload: invalid_payload
        RateLimited: rate_limited
        InvalidMove: invalid_move
        CannotDraw: cannot_draw
        NotInLobby: not_in_lobby
        AlreadyInLobby: already_in_lobby
        AlreadyMember: already_member
        LobbyNotFound: lobby_not_found
        LobbyFull: lobby_full
        LobbyExpired: lobby_expired
        NotHost: not_host
        NotEnoughPlayers: not_enough_players
        NotEnoughReady: not_enough_ready
        MatchAlreadyStarted: match_already_started
        JoinDisabledInMatch: join_disabled_in_match
        UserNotInLobby: user_not_in_lobby
        CannotKickSelf: cannot_kick_self
        CannotPromoteBot: cannot_promote_bot
        FriendRequestInvalid: friend_request_invalid
        FriendRequestExists: friend_request_exists
        FriendRequestNotFound: friend_request_not_found
        SpectatorCannotAct: spectator_cannot_act
        InternalError: internal_error
